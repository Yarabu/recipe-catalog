<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Recipe catalog with search, tag filter and sorting."
    />
    <title>Catalog — Recipe Catalog</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <div class="container site-header__inner">
        <a class="logo" href="index.html">Recipe Catalog</a>
        <nav aria-label="Main navigation">
          <ul class="nav-list">
            <li><a href="index.html">Home</a></li>
            <li><a href="catalog.html" aria-current="page">Catalog</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      <h1>Recipe catalog</h1>

      <form
        class="filters"
        id="filters"
        role="search"
        aria-label="Search and filter recipes"
      >
        <div class="field">
          <label for="q">Search by name</label>
          <input
            id="q"
            name="q"
            type="search"
            placeholder="pizza, salad…"
            autocomplete="off"
          />
        </div>

        <div class="field">
          <label for="tag">Tag</label>
          <select id="tag" name="tag">
            <option value="">All tags</option>
          </select>
        </div>

        <div class="field">
          <label for="sort">Sort by</label>
          <select id="sort" name="sort">
            <option value="">Default</option>
            <option value="name:asc">Name: A → Z</option>
            <option value="name:desc">Name: Z → A</option>
            <option value="rating:desc">Rating: highest first</option>
            <option value="prepTimeMinutes:asc">
              Prep time: shortest first
            </option>
          </select>
        </div>

        <button type="reset" class="btn" id="reset">Reset</button>
      </form>

      <p
        id="results-info"
        class="results-info"
        role="status"
        aria-live="polite"
      ></p>

      <div id="catalog-state" class="state-region" aria-live="polite"></div>
      <ul class="card-grid" id="recipe-list"></ul>

      <nav class="pagination" id="pagination" aria-label="Catalog pages" hidden>
        <button type="button" class="btn" id="prev">← Previous</button>
        <span id="page-info" aria-live="polite"></span>
        <button type="button" class="btn" id="next">Next →</button>
      </nav>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>
          Data:
          <a href="https://dummyjson.com/docs/recipes" rel="noopener"
            >DummyJSON Recipes API</a
          >
        </p>
      </div>
    </footer>

    <script type="module" src="/src/pages/catalog.ts"></script>
  </body>
</html>
